# kitsu configuration — gateway profiles.
#
# kitsu talks to ANY endpoint that speaks the OpenAI chat/completions wire
# protocol. That covers hosted APIs (OpenAI, Anthropic, Hugging Face, Mistral,
# your own corporate gateway) and local servers (Ollama, vLLM). Nothing is
# hardcoded in the binary — define one [gateways.<name>] block per endpoint and
# select it with `--gateway <name>`, or set `default_gateway` below.
#
# Auth methods:
#   { method = "none" }                                   # no token (local servers)
#   { method = "bearer-env", env = "SOME_TOKEN" }         # env first; `kitsu auth login` fallback
#   { method = "static", token = "..." }                  # inline token (discouraged)
#
# See README.md for the full guide and per-provider recipes.

default_gateway = "ollama"

# Optional privacy default: do not create automatic command-output or
# oversized tool-result artifacts. Explicit sessions, credentials, -o, and
# model filesystem writes are unaffected. The per-run equivalent is
# `--no-artifacts`.
# artifact_storage = false

# ── Local: Ollama ────────────────────────────────────────────────────────────
# `ollama serve` then `ollama pull llama3.2`. No credentials required.
[gateways.ollama]
flavor      = "openai"
base_url    = "http://localhost:11434"
chat_path   = "/v1/chat/completions"
models_path = "/v1/models"
model       = "llama3.2"
auth        = { method = "none" }
# Ollama serves a small default window (num_ctx, often 4096) regardless of the
# model's max, and its /v1/models route doesn't report it. Kitsu probes the
# native /api/ps route for the window actually being served and clamps DOWN to
# it when this value is optimistic — an oversize prompt is truncated from the
# front by the runtime, silently destroying the system prompt and tool schemas
# rather than erroring. The probe only sees a model that is already loaded, so
# keep this conservative for the first request of a cold run.
#
# To get a bigger window, raise it where it is actually served — set
# OLLAMA_CONTEXT_LENGTH for `ollama serve`, or bake num_ctx into a Modelfile.
# Setting a larger number here does not create context; it only makes kitsu
# overfill a window the runtime will quietly cut. Note that on CPU-only hosts a
# large window costs real latency.
context_window = 4096

# ── Local: vLLM ──────────────────────────────────────────────────────────────
# `vllm serve <model> --port 8000`  (add `--api-key <key>` to require a token).
[gateways.vllm]
flavor      = "openai"
base_url    = "http://localhost:8000"
chat_path   = "/v1/chat/completions"
models_path = "/v1/models"
model       = "meta-llama/Llama-3.1-8B-Instruct"
auth        = { method = "none" }
# To require auth instead:
# auth = { method = "bearer-env", env = "VLLM_API_KEY", refresh_hint = "export VLLM_API_KEY=..." }

# ── Custom gateway — the "plug anything in" template ─────────────────────────
# Copy this block, rename it, point base_url/chat_path at your endpoint, set the
# token env var (or method = "none"). Model IDs and paths are whatever your
# endpoint expects.
[gateways.custom]
flavor      = "openai"
base_url    = "https://your-gateway.example.com"
chat_path   = "/v1/chat/completions"
models_path = ""                          # set a path if your gateway lists models
model       = "your-model-id"
auth        = { method = "bearer-env", env = "CUSTOM_GATEWAY_TOKEN", refresh_hint = "export CUSTOM_GATEWAY_TOKEN=..." }

# ── Hugging Face Inference Providers (hosted) ────────────────────────────────
# Token: huggingface.co/settings/tokens ("Make calls to Inference Providers").
# Store it without shell persistence: `kitsu --gateway huggingface auth login`.
# HF PRO adds monthly inference credits + higher limits, spent via the token.
# Model = "<org>/<model>", optionally pin a provider: "<org>/<model>:together".
# Reasoning models (e.g. openai/gpt-oss-120b) spend hidden reasoning tokens;
# pass a generous --max-output-tokens or short answers come back empty.
[gateways.huggingface]
flavor      = "openai"
base_url    = "https://router.huggingface.co"
chat_path   = "/v1/chat/completions"
models_path = "/v1/models"
model       = "meta-llama/Llama-3.3-70B-Instruct"
# Llama-3.3-70B's window; hosted models are far larger than the local-model
# 8192 fallback (which false-alarms the mismatch heuristic). Override per
# model with --context-window.
context_window = 131072
# Hint wording is deliberately filter-safe: kitsu suppresses any hint that
# resembles a credential (URL schemes, `hf_`/`sk-` prefixes, bare `token`
# labels), so this must describe the fix without quoting one.
auth        = { method = "bearer-env", env = "HF_TOKEN", refresh_hint = "create a fine-grained Hugging Face credential with 'Make calls to Inference Providers', then set HF_TOKEN" }

# ── Qwen via the Hugging Face router — the hosted regression target ──────────
# A second, NON-local target so changes are validated against something other
# than a small CPU-bound Ollama model. It covers what the local setup structurally
# cannot:
#   - the FULL tool tier (a 262144 window is far above the lean-tier threshold,
#     so all 26 tool schemas are advertised, not the lean 7)
#   - spawn_agents / spawn_agent_bg / agent_result, which the lean tier drops
#   - a REMOTE gateway, confirming the Ollama-only /api/ps served-window probe
#     correctly does not fire off-loopback
#
# The model carries an explicit `:novita` provider pin. The router lists several
# providers per model with different windows and differing tool support, and an
# unpinned id would let a request land on one that cannot call tools at all.
# Pinning also makes the window deterministic instead of a MIN across providers.
[gateways.qwen]
flavor      = "openai"
base_url    = "https://router.huggingface.co"
chat_path   = "/v1/chat/completions"
models_path = "/v1/models"
model       = "Qwen/Qwen3-Coder-480B-A35B-Instruct:novita"
# novita's advertised window for this model. Set explicitly rather than left to
# discovery: catalog discovery warms a cache for the NEXT run, so a cold first
# run would fall back to the 8192 default and silently select the lean tier —
# defeating the point of this profile. Use `/context refresh` to exercise the
# live nested-providers[] discovery path on purpose.
context_window = 262144
auth        = { method = "bearer-env", env = "HF_TOKEN", refresh_hint = "create a fine-grained Hugging Face credential with 'Make calls to Inference Providers', then set HF_TOKEN" }

# ── OpenAI (hosted) ──────────────────────────────────────────────────────────
[gateways.openai]
flavor      = "openai"
base_url    = "https://api.openai.com"
chat_path   = "/v1/chat/completions"
models_path = "/v1/models"
model       = "gpt-4o-mini"
auth        = { method = "bearer-env", env = "OPENAI_API_KEY", refresh_hint = "create a key at https://platform.openai.com/api-keys and `export OPENAI_API_KEY=sk-...`" }

# ── Anthropic direct, via its OpenAI-compatible endpoint (hosted) ────────────
# Requires a developer API key (sk-ant-...) from console.anthropic.com — a
# claude.ai Pro/Max subscription login does NOT work here. Anthropic requires a
# max_tokens, so pass `--max-output-tokens N`.
[gateways.anthropic]
flavor      = "openai"
base_url    = "https://api.anthropic.com"
chat_path   = "/v1/chat/completions"
models_path = "/v1/models"
model       = "claude-opus-4-8"
auth        = { method = "bearer-env", env = "ANTHROPIC_API_KEY", expires_env = "", refresh_hint = "create a key at https://console.anthropic.com/settings/keys and `export ANTHROPIC_API_KEY=sk-ant-...`" }
