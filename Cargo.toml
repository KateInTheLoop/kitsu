[workspace]
resolver = "2"
members = [
    "crates/kitsu",
    "crates/kitsu-core",
    "crates/kitsu-providers",
    "crates/kitsu-tools",
    "crates/kitsu-render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
# Async runtime + HTTP (locked decisions, development_plan.md)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-stream = "0.1"
futures = "0.3"

# CLI + config + serde
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors + logging + time
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Terminal / rendering
owo-colors = "4"

# Internal crates
kitsu-core = { path = "crates/kitsu-core" }
kitsu-providers = { path = "crates/kitsu-providers" }
kitsu-tools = { path = "crates/kitsu-tools" }
kitsu-render = { path = "crates/kitsu-render" }

# Dev-dependencies (tests)
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serial_test = "3"
