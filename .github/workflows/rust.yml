name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install command-containment test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y bubblewrap python3-pytest
        # GitHub-hosted runners deny unprivileged loopback setup inside a new
        # network namespace. Keep Cargo and Kitsu unprivileged so permission
        # tests remain meaningful, while granting only bubblewrap the runner's
        # passwordless namespace privileges.
        sudo mv /usr/bin/bwrap /usr/bin/bwrap.real
        printf '%s\n' 'Defaults closefrom_override' | sudo tee /etc/sudoers.d/kitsu-bwrap >/dev/null
        sudo chmod 0440 /etc/sudoers.d/kitsu-bwrap
        printf '%s\n' '#!/bin/sh' 'exec /usr/bin/sudo -n -C 1024 /usr/bin/bwrap.real "$@"' | sudo tee /usr/bin/bwrap >/dev/null
        sudo chmod 0755 /usr/bin/bwrap
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
