name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install command-containment test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y bubblewrap python3-pytest
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      # Bubblewrap's loopback setup requires the runner's namespace capability;
      # the command-containment integration tests are intentionally run with the
      # hosted runner's passwordless sudo rather than silently weakening them.
      run: sudo -E env "PATH=$PATH" cargo test --verbose
