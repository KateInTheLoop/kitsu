name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install command-containment test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y bubblewrap python3-pytest
        # Ubuntu 24.04's AppArmor default blocks the unprivileged user/network
        # namespaces exercised by bubblewrap. Relax it only on this ephemeral
        # test runner; Cargo, Kitsu, and bubblewrap still run as the normal user.
        sudo sysctl -w kernel.unprivileged_userns_clone=1
        if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # Release is the profile users actually run, and it is NOT equivalent to
    # debug for correctness: `debug_assert!` does not evaluate its expression
    # when debug assertions are off. A side-effecting call placed inside one
    # therefore vanishes from the shipped binary while debug CI stays green —
    # which is exactly how a background-agent acknowledgement silently stopped
    # happening in release (subagent.rs `acknowledge_handoff`). Debug-only CI
    # cannot see that class of bug at all, so the suite runs in both profiles.
    - name: Run tests (release profile)
      run: cargo test --release --verbose
