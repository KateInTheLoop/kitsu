name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install command-containment test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y bubblewrap python3-pytest
        # GitHub-hosted runners deny unprivileged loopback setup inside a new
        # network namespace. Bubblewrap's setuid mode supplies that capability
        # while the test process itself remains an unprivileged user.
        sudo chmod u+s /usr/bin/bwrap
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
